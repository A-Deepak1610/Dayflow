version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: dayflow_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dayflow
      MYSQL_USER: dayflow_user
      MYSQL_PASSWORD: dayflow_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Node.js Express Backend Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dayflow_server
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://dayflow_user:dayflow_password@db:3306/dayflow"
      JWT_SECRET: "dayflow_jwt_secret_key_for_hackathon_demo"
      JWT_REFRESH_SECRET: "dayflow_jwt_refresh_secret_key_for_hackathon_demo"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 587
      SMTP_USER: "demo@dayflow.com"
      SMTP_PASS: "demopassword"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # React / Nginx Frontend Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dayflow_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mysql_data:
