services:
  # Express Backend API Service
  - type: web
    name: dayflow-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npx prisma db seed && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # React Frontend Static Site
  - type: web
    name: dayflow-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dayflow-backend
          property: url
